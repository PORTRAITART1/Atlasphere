services:
  atlasphere:
    image: ${ATLASPHERE_IMAGE:-ghcr.io/portraitart1/atlasphere:mainnet-hackathon}
    restart: unless-stopped
    ports:
      - "${ATLASPHERE_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      ENVIRONMENT: "prod"
      TESTNET: "false"
      PI_API_BASE_URL: "https://api.minepi.com"
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/atlasphere.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      PI_API_KEY: ${PI_API_KEY:-}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
      ADMIN_USER_EMAIL: ${ADMIN_USER_EMAIL:-}
    volumes:
      - atlasphere-data:/data

volumes:
  atlasphere-data:
