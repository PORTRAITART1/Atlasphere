services:
  atlasphere:
    image: ghcr.io/portraitart1/atlasphere:mainnet-hackathon-2026.11.22
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      PORT: "8000"
      ENVIRONMENT: "prod"
      PI_API_BASE_URL: "https://api.minepi.com"
      DATABASE_URL: "sqlite+aiosqlite:////data/atlasphere.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      PI_API_KEY: "${PI_API_KEY}"
    volumes:
      - atlasphere_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  atlasphere_data: