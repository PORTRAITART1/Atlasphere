options:
  - name: ATLASPHERE_PORT
    label: "Atlasphere Port"
    description: "The port on which Atlasphere will be accessible (default: 8000)"
    type: number
    default: 8000
    required: false

  - name: DATABASE_URL
    label: "Database URL"
    description: "Optional database URL. Leave empty to use SQLite in the persistent /data volume."
    type: string
    default: "sqlite+aiosqlite:////data/atlasphere.db"
    required: false
    secret: true

  - name: PI_API_KEY
    label: "Pi API Key"
    description: "Server-side Pi Platform API key for the Atlasphere Mainnet app."
    type: string
    default: ""
    required: true
    secret: true

  - name: JWT_SECRET_KEY
    label: "JWT Secret Key"
    description: "A unique random secret used to sign Atlasphere session tokens."
    type: string
    default: ""
    required: true
    secret: true

  - name: ADMIN_USER_ID
    label: "Admin User ID"
    description: "The Pi UID of the Atlasphere admin (optional)."
    type: string
    default: ""
    required: false

  - name: ADMIN_USER_EMAIL
    label: "Admin User Email"
    description: "The email of the Atlasphere admin (optional)."
    type: string
    default: ""
    required: false
